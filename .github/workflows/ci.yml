name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: the Elm copy of the contract examples is up to date
        run: |
          npm run contract
          git diff --exit-code -- tests/Contract/Examples.elm
      - name: elm-format, elm-review, elm-test and the optimised build
        run: npm run check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: unit, property and contract tests, and integration tests against PostgreSQL
        run: ./gradlew check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build the image and start the app with its database
        run: docker compose up --build --detach --wait
      - name: walk two claims through the running app
        run: ./scripts/smoke.sh
      - name: logs, if something went wrong
        if: failure()
        run: docker compose logs
