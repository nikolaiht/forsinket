# Everything, with one command:
#
#   docker compose up --build
#
# The app is then on http://localhost:8080, with a few demo claims in it.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: forsinket
      POSTGRES_USER: forsinket
      # For this local setup only. The database is reachable from this machine alone.
      POSTGRES_PASSWORD: forsinket
    ports:
      # For running the service outside Docker (`make dev`).
      - "127.0.0.1:54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username forsinket --dbname forsinket"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/forsinket
      DATABASE_USER: forsinket
      DATABASE_PASSWORD: forsinket
      DEMO_MODE: "true"
    ports:
      - "8080:8080"
    healthcheck:
      # The runtime image has no curl or wget, so bash asks /health itself.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3
      interval: 2s
      timeout: 3s
      retries: 60
